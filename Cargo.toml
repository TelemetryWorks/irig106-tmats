[workspace]
resolver = "3"
members = ["crates/irig106-tmats", "apps/irig106-tmats-cli"]

# One version for the library and CLI; no release is performed by this scaffold.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/TelemetryWorks/irig106-tmats"

[workspace.dependencies]
irig106-tmats = { path = "crates/irig106-tmats", version = "=0.1.0" }

# Profiles apply to the whole workspace; they shape the `tmats` binary's
# release build (a library's own profile has no effect on its dependents).
[profile.release]
lto = true
codegen-units = 1
