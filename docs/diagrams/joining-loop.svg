<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="The joining loop each tool writes (ADR-0030): irig106-core yields the next packet as plain irig106-types data; a setup-record fragment (data type 0x01) goes to the irig106-tmats assembler, and when a record completes its description becomes the governing one; every other packet is checked against the governing description by irig106-tmats and decoded with it by irig106-decode; the tool shows, indexes, or reports the result and takes the next packet.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .l { font-size: 11px; fill: #57606a; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.6; }
    .gov { fill: #ddf4ff; stroke: #0969da; stroke-width: 2.2; }
    .usr { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.2; }
    .ln { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .dg { stroke: #0969da; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; }
    .lp { stroke: #9a6700; stroke-width: 1.4; fill: none; }
    .bt { font-size: 11px; fill: #0969da; }
    .ah { fill: #57606a; } .ahb { fill: #0969da; } .ahw { fill: #9a6700; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .l { fill: #9198a1; } .bt { fill: #4493f8; }
      .box { fill: #161b22; stroke: #9198a1; } .hub, .gov { fill: #0c2d6b; stroke: #4493f8; }
      .usr { fill: #3b2e00; stroke: #d29922; } .ln { stroke: #9198a1; } .dg { stroke: #4493f8; }
      .lp { stroke: #d29922; } .ah { fill: #9198a1; } .ahb { fill: #4493f8; } .ahw { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">The joining loop each tool writes (ADR-0030, option A)</text>
  <text class="l" x="20" y="48">Packets and fragments cross as plain irig106-types data; irig106-core and irig106-tmats never depend on each other.</text>

  <rect class="box" x="20" y="72" width="240" height="60" rx="6"/>
  <text class="b" x="140" y="96" text-anchor="middle">irig106-core: next packet</text>
  <text class="l" x="140" y="114" text-anchor="middle">packet summary, or a fragment</text>

  <rect class="box" x="320" y="72" width="180" height="60" rx="6"/>
  <text class="b" x="410" y="96" text-anchor="middle">Data type 0x01?</text>
  <text class="l" x="410" y="114" text-anchor="middle">a setup-record fragment</text>

  <rect class="hub" x="560" y="64" width="210" height="76" rx="6"/>
  <text class="b" x="665" y="86" text-anchor="middle">irig106-tmats: assemble</text>
  <text class="l" x="665" y="104" text-anchor="middle">when a record completes, read it</text>
  <text class="l" x="665" y="118" text-anchor="middle">and report session findings</text>
  <text class="l" x="665" y="132" text-anchor="middle">(SRCC, event packet, channel 0)</text>

  <rect class="gov" x="810" y="72" width="170" height="60" rx="30"/>
  <text class="b" x="895" y="96" text-anchor="middle">Governing</text>
  <text class="b" x="895" y="112" text-anchor="middle">description</text>

  <rect class="hub" x="320" y="192" width="180" height="60" rx="6"/>
  <text class="b" x="410" y="214" text-anchor="middle">irig106-tmats: check</text>
  <text class="l" x="410" y="232" text-anchor="middle">channel known, type, enabled</text>
  <text class="l" x="410" y="245" text-anchor="middle">(L1-CH10-007)</text>

  <rect class="box" x="320" y="292" width="180" height="60" rx="6"/>
  <text class="b" x="410" y="316" text-anchor="middle">irig106-decode</text>
  <text class="l" x="410" y="334" text-anchor="middle">values, with the description</text>

  <rect class="usr" x="320" y="392" width="180" height="56" rx="6"/>
  <text class="b" x="410" y="416" text-anchor="middle">The tool</text>
  <text class="l" x="410" y="434" text-anchor="middle">shows, indexes, reports</text>

  <path class="ln" d="M260,102 L320,102" marker-end="url(#a)"/>
  <path class="ln" d="M500,102 L560,102" marker-end="url(#a)"/>
  <text class="l" x="514" y="94">yes</text>
  <path class="lb dg" d="M770,102 L810,102" marker-end="url(#b)"/>
  <text class="bt" x="790" y="60" text-anchor="middle">becomes</text>
  <path class="ln" d="M410,132 L410,192" marker-end="url(#a)"/>
  <text class="l" x="418" y="184">no: any other packet</text>
  <path class="ln" d="M410,252 L410,292" marker-end="url(#a)"/>
  <text class="l" x="418" y="276">findings, then</text>
  <path class="ln" d="M410,352 L410,392" marker-end="url(#a)"/>

  <path class="dg" d="M895,132 L895,222 L500,222" marker-end="url(#b)"/>
  <path class="dg" d="M895,222 L895,322 L500,322" marker-end="url(#b)"/>
  <text class="bt" x="905" y="182">governs</text>
  <text class="bt" x="905" y="282">governs</text>

  <path class="lp" d="M320,420 L140,420 L140,132" marker-end="url(#w)"/>
  <path class="lp" d="M620,140 L620,160 L200,160 L200,132" marker-end="url(#w)"/>
  <text class="l" x="630" y="156">then next packet</text>
  <text class="l" x="150" y="400">next packet</text>

  <text class="l" x="560" y="400">Before the first setup record, no description governs;</text>
  <text class="l" x="560" y="415">section 6 defines what happens to those packets.</text>
  <text class="l" x="560" y="440">A new setup record takes over for the packets after it</text>
  <text class="l" x="560" y="455">(Chapter 11 §11.2.7.2; section 5).</text>
</svg>
