<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-label="Derived parameters: function-style and formula-style C-group entries are bound or parsed with Appendix 9-E Table E-6 precedence into one description with spans, trigger, and occurrences; a derivation graph resolves dependencies with cycle detection; validation reports syntax, arity, custom algorithms, unresolved names, and cycles; irig106-decode evaluates outside this library; a reference evaluator exists only in the tests to prove precedence.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .m { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; }
    .l { font-size: 11px; fill: #57606a; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .hl { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.6; }
    .out { fill: none; stroke: #57606a; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .tst { fill: none; stroke: #1a7f37; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .gt { fill: #1a7f37; }
    .node { fill: #ffffff; stroke: #0969da; stroke-width: 1.1; }
    .ln { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .tl { stroke: #0969da; stroke-width: 1.1; fill: none; }
    .gk { stroke: #1a7f37; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    .ah { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .l { fill: #9198a1; } .gt { fill: #3fb950; }
      .box { fill: #161b22; stroke: #9198a1; } .hl { fill: #0c2d6b; stroke: #4493f8; }
      .out { stroke: #9198a1; } .tst, .gk { stroke: #3fb950; }
      .node { fill: #0d1117; stroke: #4493f8; } .tl { stroke: #4493f8; }
      .ln { stroke: #9198a1; } .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">Derived parameters: parsed and described here, evaluated in irig106-decode</text>

  <!-- inputs -->
  <rect class="box" x="20" y="60" width="300" height="136" rx="6"/>
  <text class="b" x="36" y="82">Function style (C-d\DPAT = N)</text>
  <text class="m" x="36" y="106">C-3\DPA:/;</text>
  <text class="m" x="36" y="124">C-3\DP-1:MC;   dividend</text>
  <text class="m" x="36" y="142">C-3\DP-2:MD;   divisor</text>
  <text class="m" x="36" y="160">C-3\DPTM:MD;</text>
  <text class="l" x="36" y="182">§E.9.b: order of inputs carries meaning</text>

  <rect class="box" x="20" y="226" width="300" height="100" rx="6"/>
  <text class="b" x="36" y="248">Formula style (C-d\DPAT = A)</text>
  <text class="m" x="36" y="272">C-12\DPA:MF*(SIN(MG/MH)+MJ);</text>
  <text class="m" x="36" y="290">C-12\DPTM:MJ;</text>
  <text class="l" x="36" y="312">§E.9.d; a value may contain ":"</text>

  <!-- binder and parser -->
  <rect class="box" x="360" y="100" width="150" height="56" rx="6"/>
  <text class="b" x="435" y="124" text-anchor="middle">Binder</text>
  <text class="l" x="435" y="142" text-anchor="middle">name + ordered inputs</text>
  <rect class="hl" x="360" y="246" width="150" height="64" rx="6"/>
  <text class="b" x="435" y="270" text-anchor="middle">Parser</text>
  <text class="l" x="435" y="288" text-anchor="middle">Table E-6 precedence</text>
  <text class="l" x="435" y="302" text-anchor="middle">(not C's)</text>
  <path class="ln" d="M320,128 L360,128" marker-end="url(#a)"/>
  <path class="ln" d="M320,278 L360,278" marker-end="url(#a)"/>

  <!-- description -->
  <rect class="hl" x="550" y="60" width="310" height="320" rx="8"/>
  <text class="b" x="705" y="82" text-anchor="middle">Description (spans back to C-d\DPA)</text>
  <path class="ln" d="M510,128 L550,128" marker-end="url(#a)"/>
  <path class="ln" d="M510,278 L550,278" marker-end="url(#a)"/>
  <!-- tree for MF*(SIN(MG/MH)+MJ) -->
  <path class="tl" d="M705,112 L645,160 M705,112 L765,160 M765,160 L725,208 M765,160 L815,208 M725,208 L725,256 M725,256 L690,304 M725,256 L760,304"/>
  <circle class="node" cx="705" cy="112" r="15"/><text class="m" x="705" y="116" text-anchor="middle">*</text>
  <circle class="node" cx="645" cy="160" r="15"/><text class="m" x="645" y="164" text-anchor="middle">MF</text>
  <circle class="node" cx="765" cy="160" r="15"/><text class="m" x="765" y="164" text-anchor="middle">+</text>
  <rect class="node" x="700" y="196" width="50" height="24" rx="6"/><text class="m" x="725" y="212" text-anchor="middle">SIN</text>
  <circle class="node" cx="815" cy="208" r="15"/><text class="m" x="815" y="212" text-anchor="middle">MJ</text>
  <circle class="node" cx="725" cy="256" r="15"/><text class="m" x="725" y="260" text-anchor="middle">/</text>
  <circle class="node" cx="690" cy="304" r="15"/><text class="m" x="690" y="308" text-anchor="middle">MG</text>
  <circle class="node" cx="760" cy="304" r="15"/><text class="m" x="760" y="308" text-anchor="middle">MH</text>
  <text x="566" y="352">trigger MJ · occurrences: C-d\DPNO, else 1</text>

  <!-- derivation graph and validation -->
  <rect class="box" x="890" y="60" width="190" height="150" rx="6"/>
  <text class="b" x="985" y="82" text-anchor="middle">Derivation graph</text>
  <text class="m" x="906" y="106">MG, MH → XA</text>
  <text class="m" x="906" y="124">XA     → XB</text>
  <text class="m" x="906" y="142">XB, MJ → XC</text>
  <text class="m" x="906" y="160">MF, XC → DMD</text>
  <text class="l" x="906" y="186">§E.9.d · order + cycle check</text>
  <path class="ln" d="M860,135 L890,135" marker-end="url(#a)"/>

  <rect class="box" x="890" y="230" width="190" height="120" rx="6"/>
  <text class="b" x="985" y="252" text-anchor="middle">Validation</text>
  <text x="906" y="276">syntax · arity</text>
  <text x="906" y="296">custom algorithm (warning)</text>
  <text x="906" y="316">unresolved names</text>
  <text x="906" y="336">cycles · style misuse</text>
  <path class="ln" d="M860,290 L890,290" marker-end="url(#a)"/>

  <!-- consumers -->
  <rect class="out" x="550" y="420" width="250" height="60" rx="6"/>
  <text class="b" x="675" y="444" text-anchor="middle">irig106-decode evaluates</text>
  <text class="l" x="675" y="462" text-anchor="middle">outside this library (NR-007)</text>
  <rect class="box" x="830" y="420" width="250" height="60" rx="6"/>
  <text class="b" x="955" y="444" text-anchor="middle">irig106-studio · tmats</text>
  <text class="l" x="955" y="462" text-anchor="middle">display formulas and dependencies</text>
  <path class="ln" d="M675,380 L675,420" marker-end="url(#a)"/>
  <path class="ln" d="M800,380 L900,420" marker-end="url(#a)"/>

  <!-- test-only evaluator -->
  <rect class="tst" x="20" y="400" width="340" height="80" rx="6"/>
  <text class="b gt" x="36" y="424">Reference evaluator — tests only</text>
  <text class="m" x="36" y="446">2 + 3 &amp; 1  =  2 + (3 &amp; 1)  (not C's)</text>
  <text class="l" x="36" y="466">never shipped; one test per Table E-6 level</text>
  <path class="gk" d="M360,440 L435,440 L435,310"/>
  <text class="gt" x="445" y="380">proves</text>

  <text class="l" x="20" y="520">Blue: what this library produces. Dashed grey: outside the library. Green: exists only in the test suite.</text>
</svg>
