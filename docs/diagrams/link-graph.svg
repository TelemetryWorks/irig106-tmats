<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-label="Chapter 9 group relationships (106-23 section 9.5.1 b): T, R, M, and V tie to G by Data Source ID; R ties to P, B, S, and Q by Channel Data Link Name; M ties to P, and P to embedded P, D, and B, by Data Link Name; R, D, B, and S tie to C by Measurement Name, and M does for analog measurements; X attributes extend any attribute with matching indices; the H group ties to G only through its test item (section 9.5.12), the rest of H being organisation-defined.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .g { font-size: 15px; font-weight: 700; }
    .n { font-size: 10.5px; fill: #57606a; }
    .l { font-size: 11px; fill: #57606a; }
    .e { font-size: 11px; font-weight: 600; fill: #0969da; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.6; }
    .ext { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.2; }
    .ln { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .dl { stroke: #9a6700; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; }
    .ah { fill: #57606a; } .ahx { fill: #9a6700; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .n, .l { fill: #9198a1; } .e { fill: #4493f8; }
      .box { fill: #161b22; stroke: #9198a1; } .hub { fill: #0c2d6b; stroke: #4493f8; }
      .ext { fill: #3b2e00; stroke: #d29922; } .ln { stroke: #9198a1; } .dl { stroke: #d29922; }
      .ah { fill: #9198a1; } .ahx { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahx" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">How TMATS groups link by value (Chapter 9 §9.5.1 b, §9.5.12)</text>
  <text class="l" x="20" y="50">Arrow = "this group refers to that one"; label = the attribute value that carries the link. A link's target is a key, unique among that attribute's values (ADR-0026).</text>

  <!-- nodes: letter and name inside each box -->
  <rect class="hub" x="415" y="66"  width="110" height="48" rx="6"/><text class="g" x="470" y="87" text-anchor="middle">G</text><text class="n" x="470" y="104" text-anchor="middle">General Information</text>
  <rect class="ext" x="845" y="66"  width="110" height="48" rx="6"/><text class="g" x="900" y="87" text-anchor="middle">H</text><text class="n" x="900" y="104" text-anchor="middle">Airborne Hardware</text>
  <rect class="ext" x="65"  y="176" width="110" height="48" rx="6"/><text class="g" x="120" y="197" text-anchor="middle">V</text><text class="n" x="120" y="214" text-anchor="middle">Vendor-Specific</text>
  <rect class="box" x="265" y="176" width="110" height="48" rx="6"/><text class="g" x="320" y="197" text-anchor="middle">T</text><text class="n" x="320" y="214" text-anchor="middle">Transmission</text>
  <rect class="box" x="465" y="176" width="110" height="48" rx="6"/><text class="g" x="520" y="197" text-anchor="middle">R</text><text class="n" x="520" y="214" text-anchor="middle">Recorder-Reproducer</text>
  <rect class="box" x="665" y="176" width="110" height="48" rx="6"/><text class="g" x="720" y="197" text-anchor="middle">M</text><text class="n" x="720" y="214" text-anchor="middle">Multiplex/Modulation</text>
  <rect class="box" x="85"  y="306" width="110" height="48" rx="6"/><text class="g" x="140" y="327" text-anchor="middle">Q</text><text class="n" x="140" y="344" text-anchor="middle">Message Structure</text>
  <rect class="box" x="245" y="306" width="110" height="48" rx="6"/><text class="g" x="300" y="327" text-anchor="middle">S</text><text class="n" x="300" y="344" text-anchor="middle">Message Data</text>
  <rect class="box" x="405" y="306" width="110" height="48" rx="6"/><text class="g" x="460" y="327" text-anchor="middle">B</text><text class="n" x="460" y="344" text-anchor="middle">Bus Data</text>
  <rect class="box" x="665" y="306" width="110" height="48" rx="6"/><text class="g" x="720" y="327" text-anchor="middle">P</text><text class="n" x="720" y="344" text-anchor="middle">PCM Format</text>
  <rect class="box" x="505" y="426" width="110" height="48" rx="6"/><text class="g" x="560" y="447" text-anchor="middle">C</text><text class="n" x="560" y="464" text-anchor="middle">Data Conversion</text>
  <rect class="box" x="665" y="426" width="110" height="48" rx="6"/><text class="g" x="720" y="447" text-anchor="middle">D</text><text class="n" x="720" y="464" text-anchor="middle">PCM Measurement</text>
  <rect class="ext" x="845" y="426" width="110" height="48" rx="6"/><text class="g" x="900" y="447" text-anchor="middle">X</text><text class="n" x="900" y="464" text-anchor="middle">Extension</text>

  <!-- to G: Data Source ID -->
  <path class="ln" d="M175,190 L415,96" marker-end="url(#a)"/>
  <path class="ln" d="M330,176 L440,114" marker-end="url(#a)"/>
  <path class="ln" d="M515,176 L485,114" marker-end="url(#a)"/>
  <path class="ln" d="M700,176 L525,104" marker-end="url(#a)"/>
  <text class="e" x="262" y="136">DSI</text>
  <text class="e" x="358" y="142">DSI</text>
  <text class="e" x="506" y="150">DSI</text>
  <text class="e" x="624" y="130">DSI</text>

  <!-- H to G: Test Item (§9.5.12) -->
  <path class="ln" d="M845,90 L525,90" marker-end="url(#a)"/>
  <text class="e" x="690" y="84" text-anchor="middle">TA</text>

  <!-- R to Q, S, B, P: Channel Data Link Name -->
  <path class="ln" d="M480,224 L160,306" marker-end="url(#a)"/>
  <path class="ln" d="M500,224 L315,306" marker-end="url(#a)"/>
  <path class="ln" d="M515,224 L470,306" marker-end="url(#a)"/>
  <path class="ln" d="M555,224 L700,306" marker-end="url(#a)"/>
  <text class="e" x="276" y="258">CDLN</text>
  <text class="e" x="374" y="264">CDLN</text>
  <text class="e" x="454" y="280">CDLN</text>
  <text class="e" x="640" y="258">CDLN</text>

  <!-- Data Link Name -->
  <path class="ln" d="M720,224 L720,306" marker-end="url(#a)"/>
  <text class="e" x="728" y="270">DLN</text>
  <path class="ln" d="M720,354 L720,426" marker-end="url(#a)"/>
  <text class="e" x="728" y="394">DLN</text>
  <path class="ln" d="M665,330 L515,330" marker-end="url(#a)"/>
  <text class="e" x="630" y="322" text-anchor="middle">DLN</text>
  <path class="ln" d="M775,318 C845,298 845,362 775,342" marker-end="url(#a)"/>
  <text class="e" x="850" y="334">DLN (embedded P)</text>

  <!-- Measurement Name -->
  <path class="ln" d="M665,450 L615,450" marker-end="url(#a)"/>
  <text class="e" x="640" y="442" text-anchor="middle">MN</text>
  <path class="ln" d="M475,354 L545,426" marker-end="url(#a)"/>
  <text class="e" x="518" y="386">MN</text>
  <path class="ln" d="M325,354 L505,436" marker-end="url(#a)"/>
  <text class="e" x="396" y="406">MN</text>
  <path class="ln" d="M545,224 C572,300 588,360 578,426" marker-end="url(#a)"/>
  <text class="e" x="590" y="284">MN</text>

  <!-- X extends any attribute -->
  <path class="dl" d="M845,450 L775,450" marker-end="url(#x)"/>
  <text class="l" x="810" y="440" text-anchor="middle">extends</text>
  <text class="l" x="810" y="500" text-anchor="middle">X-1\ORG\D\MN\SGAIN-1-2 extends D-1\MN-1-2</text>

  <!-- key -->
  <text class="e" x="20" y="400">DSI</text><text class="l" x="62" y="400">Data Source ID</text>
  <text class="e" x="20" y="418">CDLN</text><text class="l" x="62" y="418">Channel Data Link Name, or</text>
  <text class="l" x="62" y="432">Sub-Channel / Network Name</text>
  <text class="e" x="20" y="450">DLN</text><text class="l" x="62" y="450">Data Link Name</text>
  <text class="e" x="20" y="468">MN</text><text class="l" x="62" y="468">Measurement Name (also M → C,</text>
  <text class="l" x="62" y="482">for analog measurements)</text>
  <text class="e" x="20" y="500">TA</text><text class="l" x="62" y="500">Test Item: H\TA to G\TA; other H</text>
  <text class="l" x="62" y="514">attributes are organisation-defined</text>
</svg>
