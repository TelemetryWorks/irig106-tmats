<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="How a link resolves (team review T4, ADR-0026): values match ignoring case; a selector such as the channel data type narrows overlapping targets; one remaining candidate is resolved, none is unresolved, several are ambiguous and all are listed; equal values across linked attributes, such as P-d\DLN and D-x\DLN, are the link and not a key conflict.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; }
    .c { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
    .l { font-size: 11px; fill: #57606a; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .ok { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.6; }
    .warn { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.6; }
    .ln { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .off { stroke: #57606a; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; }
    .eq { stroke: #0969da; stroke-width: 1.6; fill: none; }
    .rule { stroke: #d0d7de; stroke-width: 1; }
    .ah { fill: #57606a; } .ahb { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .l { fill: #9198a1; }
      .box { fill: #161b22; stroke: #9198a1; } .ok { fill: #0c2d6b; stroke: #4493f8; }
      .warn { fill: #3b2e00; stroke: #d29922; } .ln, .off { stroke: #9198a1; }
      .eq { stroke: #4493f8; } .rule { stroke: #30363d; } .ah { fill: #9198a1; } .ahb { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">How a link resolves (ADR-0026)</text>
  <text class="l" x="20" y="50">Values match ignoring case; a selector narrows overlapping targets; the library reports what remains and never picks one.</text>

  <!-- column headings -->
  <text class="h" x="20"  y="82">Linking attribute</text>
  <text class="h" x="360" y="82">Candidates in the target namespace</text>
  <text class="h" x="780" y="82">Result</text>

  <!-- row 1: resolved through the selector -->
  <rect class="box" x="20" y="96" width="250" height="52" rx="6"/>
  <text class="c" x="32" y="117">R-1\CDT-1:PCMIN;</text>
  <text class="c" x="32" y="136">R-1\CDLN-1:PCM1;</text>
  <rect class="box" x="360" y="96" width="220" height="30" rx="6"/>
  <text class="c" x="372" y="116">P-1\DLN:PCM1;</text>
  <rect class="box" x="360" y="136" width="220" height="30" rx="6"/>
  <text class="c" x="372" y="156">B-1\DLN:pcm1;</text>
  <path class="ln" d="M270,111 L360,111" marker-end="url(#a)"/>
  <path class="off" d="M270,136 L360,151" marker-end="url(#a)"/>
  <text class="l" x="596" y="146">matches too (case folded), but is</text>
  <text class="l" x="596" y="160">excluded by the selector:</text>
  <text class="l" x="596" y="174">channel type PCMIN → P group</text>
  <text class="l" x="372" y="182">bus data carried in that PCM stream</text>
  <rect class="ok" x="780" y="96" width="200" height="30" rx="6"/>
  <text class="h" x="792" y="116">Resolved: P-1</text>
  <path class="ln" d="M580,111 L780,111" marker-end="url(#a)"/>

  <line class="rule" x1="20" y1="190" x2="980" y2="190"/>

  <!-- row 2: ambiguous -->
  <rect class="box" x="20" y="206" width="250" height="52" rx="6"/>
  <text class="c" x="32" y="227">R-1\CDT-2:PCMIN;</text>
  <text class="c" x="32" y="246">R-1\CDLN-2:SPI;</text>
  <rect class="box" x="360" y="206" width="220" height="30" rx="6"/>
  <text class="c" x="372" y="226">P-3\DLN:SPI;</text>
  <rect class="box" x="360" y="246" width="220" height="30" rx="6"/>
  <text class="c" x="372" y="266">P-4\DLN:SPI;</text>
  <path class="ln" d="M270,226 L360,221" marker-end="url(#a)"/>
  <path class="ln" d="M270,246 L360,261" marker-end="url(#a)"/>
  <rect class="warn" x="780" y="206" width="200" height="52" rx="6"/>
  <text class="h" x="792" y="227">Ambiguous: P-3, P-4</text>
  <text class="l" x="792" y="245">both listed, none chosen</text>
  <path class="ln" d="M580,221 L780,226" marker-end="url(#a)"/>
  <path class="ln" d="M580,261 L780,242" marker-end="url(#a)"/>
  <text class="l" x="360" y="296">Pass 4 also reports the duplicate key: two P-d\DLN values are equal.</text>

  <line class="rule" x1="20" y1="316" x2="980" y2="316"/>

  <!-- row 3: unresolved -->
  <rect class="box" x="20" y="332" width="250" height="30" rx="6"/>
  <text class="c" x="32" y="352">R-1\CDLN-3:TLM9;</text>
  <text class="l" x="360" y="352">no key in the namespace has this value</text>
  <rect class="warn" x="780" y="332" width="200" height="30" rx="6"/>
  <text class="h" x="792" y="352">Unresolved (reported)</text>
  <path class="off" d="M270,347 L350,347"/>
  <path class="ln" d="M580,347 L780,347" marker-end="url(#a)"/>

  <line class="rule" x1="20" y1="382" x2="980" y2="382"/>

  <!-- row 4: keys unique per attribute -->
  <text class="h" x="20" y="410">Keys are unique per attribute, not per file</text>
  <rect class="box" x="20" y="424" width="250" height="30" rx="6"/>
  <text class="c" x="32" y="444">P-1\DLN:PCM1;</text>
  <rect class="box" x="360" y="424" width="220" height="30" rx="6"/>
  <text class="c" x="372" y="444">D-1\DLN:PCM1;</text>
  <path class="eq" d="M270,439 L360,439" marker-end="url(#b)"/>
  <text class="l" x="284" y="472">same value = the link</text>
  <rect class="ok" x="780" y="424" width="200" height="30" rx="6"/>
  <text class="h" x="792" y="444">No conflict</text>
  <text class="l" x="596" y="436">both are keys (§9.5.1 a);</text>
  <text class="l" x="596" y="450">each is unique among its own</text>
  <text class="l" x="596" y="464">attribute's values</text>
</svg>
