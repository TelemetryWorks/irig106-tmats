<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-label="irig106-tmats in the ecosystem: the tmats CLI reads Chapter 10 recordings and TMATS files and hands setup-record payloads to the library; the CLI and library form one lockstep workspace; sibling crates depend on the library; shared types come from irig106-types.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .m { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; }
    .l { font-size: 11px; fill: #57606a; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .hl { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.6; }
    .ws { fill: none; stroke: #0969da; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .fut { fill: none; stroke: #57606a; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .dl { stroke: #57606a; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ah { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .l { fill: #9198a1; }
      .box { fill: #161b22; stroke: #9198a1; } .hl { fill: #0c2d6b; stroke: #4493f8; }
      .ws { stroke: #4493f8; } .fut, .ln, .dl { stroke: #9198a1; } .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">irig106-tmats in the TelemetryWorks ecosystem</text>

  <!-- inputs -->
  <rect class="box" x="20" y="80" width="180" height="56" rx="6"/>
  <text class="b" x="110" y="103" text-anchor="middle">Chapter 10 recording</text>
  <text class="l" x="110" y="122" text-anchor="middle">setup records = data type 0x01</text>

  <rect class="box" x="20" y="176" width="180" height="56" rx="6"/>
  <text class="b" x="110" y="199" text-anchor="middle">TMATS text file</text>
  <text class="l" x="110" y="218" text-anchor="middle">standalone code-name TMATS</text>

  <rect class="fut" x="20" y="330" width="180" height="56" rx="6"/>
  <text class="b" x="110" y="353" text-anchor="middle">irig106-core (future)</text>
  <text class="l" x="110" y="372" text-anchor="middle">shared packet reader</text>

  <!-- workspace -->
  <rect class="ws" x="250" y="56" width="420" height="206" rx="10"/>
  <text class="l" x="264" y="74">one workspace · one version · one tag · one changelog</text>

  <rect class="box" x="266" y="88" width="170" height="160" rx="6"/>
  <text class="b" x="351" y="110" text-anchor="middle">irig106-tmats-cli</text>
  <text class="m" x="351" y="130" text-anchor="middle">binary: tmats</text>
  <text x="351" y="156" text-anchor="middle">show · extract</text>
  <text x="351" y="175" text-anchor="middle">checksum · verify · stamp</text>
  <text x="351" y="194" text-anchor="middle">validate · diff (later)</text>
  <text class="l" x="351" y="222" text-anchor="middle">minimal Ch10 packet reader</text>
  <text class="l" x="351" y="237" text-anchor="middle">(until irig106-core)</text>

  <rect class="hl" x="486" y="88" width="170" height="160" rx="6"/>
  <text class="b" x="571" y="110" text-anchor="middle">irig106-tmats</text>
  <text class="l" x="571" y="128" text-anchor="middle">library</text>
  <text x="571" y="156" text-anchor="middle">Document (lossless)</text>
  <text x="571" y="175" text-anchor="middle">registry · views · links</text>
  <text x="571" y="194" text-anchor="middle">validate · edits · write</text>
  <text x="571" y="213" text-anchor="middle">G\SHA · flex signature</text>

  <!-- input arrows -->
  <path class="ln" d="M200,108 L266,130" marker-end="url(#a)"/>
  <text class="l" x="24" y="154">memory-mapped, header to header</text>
  <path class="ln" d="M200,204 L266,196" marker-end="url(#a)"/>
  <text class="l" x="210" y="222">bytes</text>
  <path class="dl" d="M110,330 L110,300 L351,300 L351,248" marker-end="url(#a)"/>
  <text class="l" x="160" y="294">replaces the CLI's reader</text>

  <!-- CLI to lib -->
  <path class="ln" d="M436,168 L486,168" marker-end="url(#a)"/>
  <text class="l" x="461" y="160" text-anchor="middle">payload</text>

  <!-- types -->
  <rect class="box" x="436" y="330" width="270" height="56" rx="6"/>
  <text class="b" x="571" y="353" text-anchor="middle">irig106-types</text>
  <text class="l" x="571" y="372" text-anchor="middle">Irig106Version · DataTypeCode · setup-record CSDW</text>
  <path class="ln" d="M571,248 L571,330" marker-end="url(#a)"/>
  <text class="l" x="580" y="294">shared types</text>

  <!-- consumers -->
  <text class="l" x="740" y="74">depend on the library</text>
  <rect class="box" x="740" y="86"  width="180" height="40" rx="6"/><text x="830" y="111" text-anchor="middle">irig106-ch10-reader</text>
  <rect class="box" x="740" y="136" width="180" height="40" rx="6"/><text x="830" y="161" text-anchor="middle">irig106-studio (GUI view)</text>
  <rect class="box" x="740" y="186" width="180" height="40" rx="6"/><text x="830" y="211" text-anchor="middle">irig106-decode</text>
  <rect class="box" x="740" y="236" width="180" height="40" rx="6"/><text x="830" y="261" text-anchor="middle">irig106-write</text>
  <rect class="box" x="740" y="286" width="180" height="40" rx="6"/><text x="830" y="306" text-anchor="middle">irig106-cli</text><text class="l" x="830" y="320" text-anchor="middle">complete ecosystem CLI</text>
  <path class="ln" d="M740,106 L656,130" marker-end="url(#a)"/>
  <path class="ln" d="M740,156 L656,150" marker-end="url(#a)"/>
  <path class="ln" d="M740,206 L656,172" marker-end="url(#a)"/>
  <path class="ln" d="M740,256 L656,196" marker-end="url(#a)"/>
  <path class="ln" d="M740,306 L656,220" marker-end="url(#a)"/>

  <text class="l" x="20" y="440">Solid arrows: data or dependency. Dashed: planned. The library never opens files; only the CLI (and later irig106-core) reads Chapter 10 recordings.</text>
</svg>
