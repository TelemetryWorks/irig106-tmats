<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="What a packet says and what the setup record adds, using the standard's own Appendix 9-C example: a PCM packet says only channel ID 2, data type 0x09, a time, and bytes; the setup record says channel 2 is a PCM input on data link PCM1 (R-1), PCM1 is a 2 Mbit/s NRZ-L stream of 10-bit words, 277 words per minor frame and 64 minor frames (P-2), measurement 82AJ01 is two fragments at words 113 and 121 of frame 5, every 32 frames (D-3), and 82AJ01 is two's complement times 0.03125 in metres per second squared (C-7).">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; }
    .b { font-weight: 600; }
    .m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; }
    .l { font-size: 11px; fill: #57606a; }
    .e { font-size: 11px; font-weight: 600; fill: #0969da; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .pkt { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.4; }
    .tm { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
    .ln { stroke: #57606a; stroke-width: 1.3; fill: none; }
    .lb { stroke: #0969da; stroke-width: 1.4; fill: none; }
    .ah { fill: #57606a; } .ahb { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .l { fill: #9198a1; } .e { fill: #4493f8; }
      .box { fill: #161b22; stroke: #9198a1; } .pkt { fill: #3b2e00; stroke: #d29922; }
      .tm { fill: #0c2d6b; stroke: #4493f8; } .ln { stroke: #9198a1; } .lb { stroke: #4493f8; }
      .ah { fill: #9198a1; } .ahb { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">What a packet says, and what the setup record adds</text>
  <text class="l" x="20" y="50">The standard's own example: 106-24R1 Chapter 9, Appendix 9-C (recorder R-1, PCM format P-2, measurements D-3, conversion C-7)</text>

  <!-- packet -->
  <text class="h" x="20" y="82">A PCM packet in the recording</text>
  <rect class="pkt" x="20" y="92" width="330" height="150" rx="6"/>
  <text class="m" x="34" y="116">channel ID       2</text>
  <text class="m" x="34" y="136">data type        0x09  PCM Data, Format 1</text>
  <text class="m" x="34" y="156">relative time    …</text>
  <text class="m" x="34" y="176">data             10111000000110011111…</text>
  <text class="l" x="34" y="204">It does not say what channel 2 is, how its bits</text>
  <text class="l" x="34" y="219">are framed, which bits hold which measurement,</text>
  <text class="l" x="34" y="234">or what a value means in engineering units.</text>

  <!-- setup record chain -->
  <text class="h" x="430" y="82">What the setup record says (read by irig106-tmats)</text>

  <rect class="tm" x="430" y="92" width="550" height="62" rx="6"/>
  <text class="b" x="444" y="111">Recorder channel (R-1)</text>
  <text class="m" x="444" y="129">R-1\TK1-1:2; R-1\CDT-1:PCMIN; R-1\CDLN-1:PCM1;</text>
  <text class="l" x="444" y="146">channel ID 2 is a PCM input; its data link is named PCM1</text>

  <rect class="tm" x="430" y="182" width="550" height="62" rx="6"/>
  <text class="b" x="444" y="201">PCM format (P-2)</text>
  <text class="m" x="444" y="219">P-2\DLN:PCM1; P-2\D2:2000000; P-2\F1:10; P-2\MF\N:64; P-2\MF1:277;</text>
  <text class="l" x="444" y="236">2 Mbit/s NRZ-L, 10-bit words, 277 words per minor frame, 64 minor frames, 30-bit sync</text>

  <rect class="tm" x="430" y="272" width="550" height="62" rx="6"/>
  <text class="b" x="444" y="291">Measurement location (D-3)</text>
  <text class="m" x="444" y="309">D-3\MN-1-1:82AJ01; …WP-1-1-1-1:113; …WP-1-1-1-2:121; …FP:5; …FI:32;</text>
  <text class="l" x="444" y="326">82AJ01 is two fragments, words 113 and 121 of frame 5, repeating every 32 frames</text>

  <rect class="tm" x="430" y="362" width="550" height="62" rx="6"/>
  <text class="b" x="444" y="381">Conversion (C-7)</text>
  <text class="m" x="444" y="399">C-7\DCN:82AJ01; C-7\DCT:COE; C-7\CO-1:.03125; C-7\BFM:TWO; C-7\MN3:MTR/S/S;</text>
  <text class="l" x="444" y="416">two's complement × 0.03125 → "LANTZ Norm acceleration" in m/s²</text>

  <path class="ln" d="M350,120 L430,120" marker-end="url(#a)"/>
  <text class="l" x="360" y="112">channel ID 2</text>

  <path class="lb" d="M460,154 L460,182" marker-end="url(#b)"/>
  <text class="e" x="470" y="172">CDLN = DLN: PCM1</text>
  <path class="lb" d="M460,244 L460,272" marker-end="url(#b)"/>
  <text class="e" x="470" y="262">DLN: PCM1</text>
  <path class="lb" d="M460,334 L460,362" marker-end="url(#b)"/>
  <text class="e" x="470" y="352">measurement name = DCN: 82AJ01</text>

  <text class="l" x="20" y="286">irig106-tmats turns the setup record into</text>
  <text class="l" x="20" y="301">answers like these, with every link resolved,</text>
  <text class="l" x="20" y="316">every value's state known, and every rule cited.</text>
  <text class="l" x="20" y="346">irig106-decode then uses them to find frame sync,</text>
  <text class="l" x="20" y="361">extract 82AJ01 from words 113 and 121, and</text>
  <text class="l" x="20" y="376">convert it to m/s².</text>
</svg>
