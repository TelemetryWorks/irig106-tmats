<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Document model: the original TMATS bytes are kept once; each item records byte spans for its code name and value plus a parsed, case-folded key; an index maps keys and patterns to item ids; the G\SHA digest covers every byte except the G\SHA item itself.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .m { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .l { font-size: 11px; fill: #57606a; }
    .code { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.2; }
    .val { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .del { fill: none; stroke: #8c959f; stroke-width: 1; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .ex { fill: none; stroke: #9a6700; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .ext { font-size: 11px; fill: #9a6700; }
    .ln { stroke: #57606a; stroke-width: 1.2; fill: none; }
    .ah { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .l { fill: #9198a1; }
      .code { fill: #0c2d6b; stroke: #4493f8; } .val, .box { fill: #161b22; stroke: #9198a1; }
      .del { stroke: #6e7681; } .ex { stroke: #d29922; } .ext { fill: #d29922; }
      .ln { stroke: #9198a1; } .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="t" x="20" y="30">One buffer, spans, keys, and an index</text>
  <text class="l" x="20" y="52">Example input (36 bytes, shown with a short digest; a real G\SHA value is "2-" followed by 64 hex digits)</text>

  <!-- byte strip: 18 px per byte, starting at x=60 -->
  <text class="l" x="20" y="104">bytes</text>
  <rect class="code" x="60"  y="84" width="72"  height="30"/><text class="m" x="96"  y="104" text-anchor="middle">G\PN</text>
  <rect class="del"  x="132" y="84" width="18"  height="30"/><text class="m" x="141" y="104" text-anchor="middle">:</text>
  <rect class="val"  x="150" y="84" width="90"  height="30"/><text class="m" x="195" y="104" text-anchor="middle">ALPHA</text>
  <rect class="del"  x="240" y="84" width="18"  height="30"/><text class="m" x="249" y="104" text-anchor="middle">;</text>
  <rect class="code" x="258" y="84" width="90"  height="30"/><text class="m" x="303" y="104" text-anchor="middle">G\SHA</text>
  <rect class="del"  x="348" y="84" width="18"  height="30"/><text class="m" x="357" y="104" text-anchor="middle">:</text>
  <rect class="val"  x="366" y="84" width="108" height="30"/><text class="m" x="420" y="104" text-anchor="middle">2-9f3c</text>
  <rect class="del"  x="474" y="84" width="18"  height="30"/><text class="m" x="483" y="104" text-anchor="middle">;</text>
  <rect class="code" x="492" y="84" width="162" height="30"/><text class="m" x="573" y="104" text-anchor="middle">R-1\TK1-1</text>
  <rect class="del"  x="654" y="84" width="18"  height="30"/><text class="m" x="663" y="104" text-anchor="middle">:</text>
  <rect class="val"  x="672" y="84" width="18"  height="30"/><text class="m" x="681" y="104" text-anchor="middle">3</text>
  <rect class="del"  x="690" y="84" width="18"  height="30"/><text class="m" x="699" y="104" text-anchor="middle">;</text>

  <!-- offsets -->
  <text class="l" x="60"  y="130" text-anchor="middle">0</text>
  <text class="l" x="258" y="130" text-anchor="middle">11</text>
  <text class="l" x="492" y="130" text-anchor="middle">24</text>
  <text class="l" x="708" y="130" text-anchor="middle">36</text>

  <!-- G\SHA exclusion -->
  <rect class="ex" x="256" y="78" width="238" height="42" rx="3"/>
  <text class="ext" x="375" y="72" text-anchor="middle">excluded from the digest: "G\SHA" … ";" (Ch 6 §6.2.3.11 f)</text>

  <!-- legend -->
  <rect class="code" x="740" y="84" width="18" height="14"/><text class="l" x="764" y="95">code-name span</text>
  <rect class="val"  x="740" y="104" width="18" height="14"/><text class="l" x="764" y="115">value span</text>

  <!-- items table -->
  <text class="b" x="60" y="178">items (in input order)</text>
  <rect class="box" x="60" y="190" width="520" height="118" rx="6"/>
  <text class="l" x="76"  y="212">id</text><text class="l" x="120" y="212">code</text><text class="l" x="210" y="212">value</text><text class="l" x="300" y="212">key (group · occurrence · path · indices)</text>
  <text class="m" x="76"  y="238">0</text><text class="m" x="120" y="238">0..4</text><text class="m" x="210" y="238">5..10</text><text class="m" x="300" y="238">G · – · PN · []</text>
  <text class="m" x="76"  y="262">1</text><text class="m" x="120" y="262">11..16</text><text class="m" x="210" y="262">17..23</text><text class="m" x="300" y="262">G · – · SHA · []</text>
  <text class="m" x="76"  y="286">2</text><text class="m" x="120" y="286">24..33</text><text class="m" x="210" y="286">34..35</text><text class="m" x="300" y="286">R · 1 · TK1 · [1]</text>

  <!-- index -->
  <text class="b" x="640" y="178">index (built during the scan)</text>
  <rect class="box" x="640" y="190" width="320" height="118" rx="6"/>
  <text class="m" x="656" y="222">G\PN</text><text class="m" x="790" y="222">→ [0]</text>
  <text class="m" x="656" y="246">G\SHA</text><text class="m" x="790" y="246">→ [1]</text>
  <text class="m" x="656" y="270">R-1\TK1-1</text><text class="m" x="790" y="270">→ [2]</text>
  <text class="m" x="656" y="294">R-1\TK1-*</text><text class="m" x="790" y="294">→ [2]</text>
  <text class="l" x="880" y="294">pattern</text>
  <path class="ln" d="M580,248 L640,248" marker-end="url(#a)"/>

  <!-- digest -->
  <text class="b" x="60" y="352">digest (computed in the same pass)</text>
  <rect class="box" x="60" y="364" width="520" height="68" rx="6"/>
  <text x="76" y="388">SHA-256 over bytes 0..11 and 24..36  →  "2-" + 64 lower-case hex</text>
  <text x="76" y="412">compared with the stored value 2-9f3c  →  match · mismatch · absent · malformed</text>

  <text class="b" x="640" y="352">what is never done</text>
  <rect class="box" x="640" y="364" width="320" height="68" rx="6"/>
  <text x="656" y="388">no copy of the text, no upper-casing</text>
  <text x="656" y="412">values stay bytes until a view asks</text>

  <text class="l" x="20" y="458">Case-insensitivity lives in the keys ("r-1\tk1-1" and "R-1\TK1-1" fold to the same key); the bytes keep the original spelling.</text>
</svg>
