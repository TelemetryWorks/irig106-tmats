# irig106-tmats/data/attributes.toml
#
# TMATS Attribute Metadata Registry — Source of Truth
#
# Derived from IRIG 106 Ch9 §9.5 tables across versions 106-04 through 106-17.
# Each entry maps to an AttrMeta record used by the validation engine,
# version migration advisor, and keyword/MFS enforcement.
#
# Fields:
#   code_name    — Code-name pattern (e.g., "G\\PN", "R-x\\TK1-n")
#   display_name — Human-readable name
#   group        — Group prefix letter
#   section      — Spec section reference
#   introduced   — First IRIG 106 version containing this attribute
#   deprecated   — Version where attribute was deprecated (optional)
#   removed      — Version where attribute was removed (optional)
#   required     — Requirement tag: R, RO, R_CH10, RO_CH10, RO_PAK, OPT
#   mfs          — Maximum Field Size in characters (optional)
#   value_type   — Keyword, Text, Integer, Decimal, Scientific, Date, Boolean, FreeForm
#   keywords     — Comma-separated list of valid keyword values (optional)
#   description  — Brief description
#
# Traceability: L3-VERSION-006, L3-VERSION-007
# =============================================================================

