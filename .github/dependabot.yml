version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Owner Dependabot policy 2026-11-16: majors are planned in the
    # coordinator's planned-major-upgrades list; security updates are unaffected.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"
    # Keep the workflow SHA pins; Dependabot updates pins and version comments.
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /
      - /irig106-tmats-cli
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Owner Dependabot policy 2026-11-16: majors are planned in the
    # coordinator's planned-major-upgrades list; security updates are unaffected.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
